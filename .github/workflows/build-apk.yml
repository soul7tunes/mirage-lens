name: Build APK

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install NDK, CMake and platform
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;27.2.12479018" "cmake;3.22.1" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirage-lens-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: Mirage Lens ${{ github.ref_name }}
          body: |
            Mirage Lens — offline on-device AI camera (Mirage 22 MB vision model).
            - Take a photo or pick one from the gallery
            - Describes the scene, reads English text, finds objects with boxes
            - Fully offline, free, no account, no ads
            - Universal APK: works on arm64 and armv7 Android phones (Android 7.0+)
            - Note: English text reads best. Hindi (Devanagari) text is not read correctly by the model yet.
